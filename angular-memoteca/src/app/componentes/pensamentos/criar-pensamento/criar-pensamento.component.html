<section class="container criar-pensamentos ff-inter">
  <header class="header">
    <h2>Adicione um <br> pensamento novo</h2>
  </header>
  <form [formGroup]="formGroup">
    <label for="pensamento">Pensamento</label>
    <input
    type="textarea"
    class="input"
    id="pensamento"
    placeholder="Digite o pensamento"

    formControlName="conteudo">

    <label for="autoria">Autoria ou fonte</label>
    <input
    type="text"
    class="input"
    id="autoria"
    placeholder="Digite a autoria ou fonte"
    formControlName="autoria">

    <label for="modelo">Selecione um modelo do card:</label>
    <div class="container-radio">
      <div class="radio-modelo">
        <label for="modelo1">
          <input
          type="radio"
          id="modelo1"
          value="modelo1"
          formControlName="modelo">
          <div class="custom-radio">
            <span></span>
          </div>
          <span>Modelo 1</span>
        </label>
        Prévia:
        <div class="modelo modelo1 ff-roboto-mono">
          <img src="assets/imagens/modelo1.png" alt="Aspas azul">
          <p class="conteudo">{{ formGroup.get('conteudo')?.value }}</p>
          <p class="autoria"><b>{{ formGroup.get('autoria')?.value }}</b></p>
        </div>
      </div>
      <div class="radio-modelo">
        <label for="modelo2">
          <input
          type="radio"
          formControlName="modelo"
          id="modelo2"
          value="modelo2"
         >
          <div class="custom-radio">
            <span></span>
          </div>
          <span>Modelo 2</span>
        </label>
        Prévia:
        <div class="modelo modelo2 ff-roboto-mono">
          <img src="assets/imagens/modelo2.png" alt="Aspas azul claro">
          <p class="conteudo">{{ formGroup.get('conteudo')?.value }}</p>
          <p class="autoria"><b>{{ formGroup.get('autoria')?.value }}</b></p>
        </div>
      </div>
      <div class="radio-modelo">
        <label for="modelo3">
          <input
          type="radio"
          formControlName="modelo"
          id="modelo3"
          value="modelo3">
          <div class="custom-radio">
            <span></span>
          </div>
          <span>Modelo 3</span>
        </label>
        Prévia:
        <div class="modelo modelo3 ff-roboto-mono">
          <img src="assets/imagens/modelo3.png" alt="Aspas verde">
          <p class="conteudo">{{ formGroup.get('conteudo')?.value }}</p>
          <p class="autoria"><b>{{ formGroup.get('autoria')?.value }}</b></p>
        </div>
      </div>
    </div>
    <div class="acoes">
      <button class="botao" (click)="createThinking()">Salvar</button>
      <button class="botao-cancelar" (click)="onCancel()">Cancelar</button>
    </div>
  </form>
</section>
