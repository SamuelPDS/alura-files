<section class="container">
  <header class="header text-center">
      <h2 class="ff-inter">Meu Mural</h2>
      <button class="botao text-center" routerLink="/criarpensamento">Adicionar pensamento</button>
  </header>

<div class="mural" *ngIf="listaPensamento.length > 0, else semPensamentos">
  <div *ngFor="let pensamento of listaPensamento" >
    <app-card-pensamento [pensamento]="pensamento"></app-card-pensamento>
  </div>
</div>
<ng-template #semPensamentos>
  <div class="ff-inter sem-pensamentos">
    <p>Não há pensamentos disponíveis no momento</p>
  </div>
</ng-template>
</section>
